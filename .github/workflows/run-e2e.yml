name: Run Staging E2E Tests

on:
  repository_dispatch:
    types: [staging-to-main-pr]

jobs:
  run-e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    env:
      PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.PLAYWRIGHT_TEST_BASE_URL }}
      STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
      VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_ROLE_PASSWORD: ${{ secrets.NEON_ROLE_PASSWORD }}
      NEON_DB_USER: ${{ secrets.NEON_DB_USER }}
      NEON_DB_NAME: ${{ secrets.NEON_DB_NAME }}
      NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      E2E_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.E2E_APP_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          owner: villageco-op
          repositories: ${{ github.event.client_payload.repo }}

      - name: Set Pending Status on PR
        uses: myrotvorets/set-commit-status-action@v2.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          repo: ${{ github.event.client_payload.repo }}
          sha: ${{ github.event.client_payload.sha }}
          context: "E2E Tests (Playwright)"
          status: "pending"
          description: "E2E tests are running..."
          targetUrl: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      
      - name: Checkout E2E Tests Code
        uses: actions/checkout@v4

      - name: Install pnpm & dependencies
        uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Create Neon Branch
        id: neon
        run: node ./scripts/create-neon-branch.js

      - name: Run Playwright Tests
        run: pnpm test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Delete Neon Branch
        if: always()
        run: node ./scripts/delete-neon-branch.js "${{ steps.neon.outputs.branch_id }}"

      - name: Cleanup Stripe Customers
        if: always()
        run: node ./scripts/stripe-cleanup.js

      - name: Report Success
        if: success()
        uses: myrotvorets/set-commit-status-action@v2.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          repo: ${{ github.event.client_payload.repo }}
          sha: ${{ github.event.client_payload.sha }}
          context: "E2E Tests (Playwright)"
          status: "success"
          description: "All E2E tests passed!"
          targetUrl: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report Failure
        if: failure()
        uses: myrotvorets/set-commit-status-action@v2.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          repo: ${{ github.event.client_payload.repo }}
          sha: ${{ github.event.client_payload.sha }}
          context: "E2E Tests (Playwright)"
          status: "failure"
          description: "E2E tests failed."
          targetUrl: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
